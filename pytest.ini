[pytest]
testpaths = tests
# `pytest -W error` is the documented command (README, RUNBOOK) and it had stopped
# working: importing prody emits a pyparsing deprecation, so EVERY test that reaches
# prody failed as an error -- 20 of them -- and the gate that is supposed to catch our
# own warnings caught nothing instead. Ignored narrowly, by message, so a warning from
# this project still fails the run. Drop it when prody stops using setParseAction.
filterwarnings =
    ignore:.*setParseAction.*
markers =
    subtype_e2e: a whole-pipeline run for one disease subtype (slow, needs network)
    network: needs internet access (runs by default)
    regression: needs env ADEP_DATA (reference data)
    dogsite: needs env DOGSITE_BIN (DoGSiteScorer binary)
    pocketmatch: needs env PM_BIN_DIR (PocketMatch binaries)
    docking: needs smina on PATH
    docker: needs a working docker CLI
    rdkit: needs the rdkit package (ligand preparation)
    procps: needs pgrep; the slim image has no procps
    repo_files: needs docs/ or bin/ from a checkout; skipped inside the image
    openbabel: needs the openbabel package (receptor/ligand conversion)
    pushover: needs PUSHOVER_APP_TOKEN and PUSHOVER_USER_KEY
